<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Mode</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, 'Segoe UI', sans-serif;
    background: #f0f0f5; color: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; border: 2.5px solid #1a1a2e; border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    max-width: 480px; width: 100%; overflow: hidden;
  }
  .card-header {
    background: #1a1a2e; color: #fff; padding: 14px 20px;
    border-radius: 11px 11px 0 0;
  }
  .card-header h2 { font-size: 15pt; font-weight: 700; }
  .card-body { padding: 22px; line-height: 1.6; }
  .card-body p { margin: 8px 0; }
  .status {
    padding: 14px 18px; border-radius: 8px; margin: 16px 0;
    font-weight: 600; font-size: 11pt; text-align: center;
  }
  .status.on { background: #e8f5e9; border: 1.5px solid #a5d6a7; color: #2d6a2d; }
  .status.off { background: #fff3f3; border: 1.5px solid #ffcdd2; color: #cc0000; }
  button {
    display: block; width: 100%; padding: 12px;
    border: 2px solid #1a1a2e; border-radius: 8px;
    background: #1a1a2e; color: #fff; font-family: inherit;
    font-size: 11pt; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2d2d4e; }
  button.secondary { background: #fff; color: #1a1a2e; margin-top: 8px; }
  button.secondary:hover { background: #f0f0f5; }
  .note { font-size: 9.5pt; color: #888; margin-top: 12px; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h2>Staff Mode</h2>
  </div>
  <div class="card-body">
    <p>This page controls whether your card views are tracked in the review analytics spreadsheet.</p>

    <div class="status" id="status"></div>

    <button id="toggleBtn" onclick="toggle()"></button>
    <button class="secondary" onclick="window.history.back()">Go back</button>

    <p class="note">This setting is saved in your browser. You only need to do this once per browser. Students will never see this page.</p>
  </div>
</div>

<script>
function isStaff() {
  try { return localStorage.getItem('_wc_staff') === '1'; } catch(e) { return false; }
}

function update() {
  var on = isStaff();
  var status = document.getElementById('status');
  var btn = document.getElementById('toggleBtn');
  if (on) {
    status.className = 'status on';
    status.textContent = 'Staff mode is ON — your card views are NOT tracked';
    btn.textContent = 'Turn off staff mode';
    btn.className = 'secondary';
  } else {
    status.className = 'status off';
    status.textContent = 'Staff mode is OFF — your card views WILL be tracked';
    btn.textContent = 'Turn on staff mode';
    btn.className = '';
  }
}

function toggle() {
  try {
    if (isStaff()) {
      localStorage.removeItem('_wc_staff');
    } else {
      localStorage.setItem('_wc_staff', '1');
    }
  } catch(e) {}
  update();
}

update();
</script>
</body>
</html>
